name:                kernmantle-frp
version:             0.1.0.1
github:              "YPares/kernmantle"
license:             BSD3
author:              "Yves Parès"
maintainer:          "yves.pares@gmail.com"
copyright:           "2026 Yves Parès"

synopsis:            Functional Reactive Programming & Coalgebraic Engine for Kernmantle Ropes
category:            Control

description:         Please see the README on GitHub at <https://github.com/YPares/kernmantle#readme>

dependencies:
- base >= 4.7 && < 5
- kernmantle
- profunctors >= 5.5.2
- primitive
- polytropos-core >= 0.1.0.1
- polytropos-plugin
- polytropos-profunctors >= 0.1.0.1
- containers

ghc-options:
- -fplugin=Polytropos.Plugin

library:
  source-dirs: src

executables:
  exMSF:
    main: examples/ExMSF.hs
    dependencies:
      - kernmantle-frp
      - kernmantle
      - polytropos-core
      - polytropos-profunctors
  exMealy:
    main: examples/ExMealy.hs
    dependencies:
      - kernmantle-frp
      - kernmantle
      - polytropos-core
      - polytropos-profunctors
  exContinuity:
    main: examples/ExContinuity.hs
    dependencies:
      - kernmantle-frp
      - kernmantle
      - polytropos-core
      - polytropos-profunctors
  exAnalysis:
    main: examples/ExAnalysis.hs
    dependencies:
      - kernmantle-frp
      - kernmantle
      - polytropos-core
      - polytropos-profunctors
      - containers
